<style>
/* =========================================================
   COLORES CORPORATIVOS PLAY&GO — EDITAR AQUÍ
   Aproximación visual (naranja/coral + azul petróleo), coherente
   con playgoxp.com. Sustituir por el HEX exacto del manual de marca
   cuando se tenga; el resto de colores de sector/tecnología se
   generan a partir de estas variables.
   ========================================================= */
:root{
  --pg-primary:      #E86457; /* coral oficial del logo Play&go */
  --pg-primary-dark: #D1483A;
  --pg-dark:         #201A18; /* neutro oscuro para cabecera/texto, a juego con el coral */
  --pg-light:        #FFF8F6;
  --pg-accent:       #1B998B; /* turquesa complementario — no confirmado en el logo, ajustable */
  --pg-text:         #1F2A30;
  --pg-border:       #EDE1DE;

  /* Paleta por sector (6 sectores de la web + 'otros') */
  --sec-turismo:        #E86457;
  --sec-cultura:         #8E44AD;
  --sec-educacion:       #2E86C1;
  --sec-social:          #C2185B;
  --sec-medio_ambiente:  #3CA55C;
  --sec-salud:           #E1A730;
  --sec-otros:           #7A8890;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--pg-text);background:var(--pg-light);}
#app{display:flex;flex-direction:column;height:100vh;min-height:560px;}

header.pg-header{
  background:var(--pg-dark);
  color:#fff;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
header.pg-header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px;}
header.pg-header h1 span{color:var(--pg-primary);}
header.pg-header .pg-count{font-size:12px;color:#B9C4C8;white-space:nowrap;}
.pg-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.pg-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.2px;}
.pg-badge .pg-badge-num{font-weight:800;}
.pg-badge-projects{background:var(--pg-primary);}
.pg-badge-pois{background:#5B6770;}
.pg-visits-badge{height:20px;display:block;}

.pg-search-wrap{display:flex;gap:8px;align-items:center;flex:1;min-width:220px;max-width:420px;}
#pg-search{flex:1;padding:8px 12px;border-radius:20px;border:1px solid transparent;font-size:14px;outline:none;}
#pg-search:focus{box-shadow:0 0 0 2px var(--pg-primary);}

#pg-legend-toggle{
  padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);
  background:transparent;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;
}
#pg-legend-toggle:hover{border-color:var(--pg-primary);color:var(--pg-primary);}
#pg-add-toggle, #pg-export-toggle{
  padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);
  background:transparent;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;
}
#pg-add-toggle:hover, #pg-export-toggle:hover{border-color:var(--pg-primary);color:var(--pg-primary);}

#pg-addform{
  background:#fff;border-bottom:1px solid var(--pg-border);padding:0 16px;
  max-height:0;overflow:hidden;transition:max-height .25s ease, padding .25s ease;
}
#pg-addform.open{max-height:400px;padding:14px 16px;overflow-y:auto;}
.pg-form-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
#pg-addform label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#7A8890;font-weight:600;flex:1;min-width:150px;}
#pg-addform input, #pg-addform select, #pg-addform textarea{
  font-size:13px;padding:6px 8px;border:1px solid var(--pg-border);border-radius:6px;font-family:inherit;color:var(--pg-text);
}
#pg-addform textarea{resize:vertical;width:100%;margin-bottom:8px;}
.pg-form-pick{align-self:flex-end;border:1px solid var(--pg-primary);background:#fff;color:var(--pg-primary);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
.pg-form-pick.active{background:var(--pg-primary);color:#fff;}
.pg-form-actions{display:flex;align-items:center;gap:12px;}
.pg-form-submit{background:var(--pg-primary);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.pg-form-submit:hover{background:var(--pg-primary-dark);}
.pg-form-status{font-size:12px;color:var(--pg-accent);font-weight:600;}

#pg-exportbox{
  background:#fff;border-bottom:1px solid var(--pg-border);padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;
  max-height:0;overflow:hidden;transition:max-height .25s ease, padding .25s ease;
}
#pg-exportbox.open{max-height:100px;padding:12px 16px;}
#pg-exportbox button{border:1px solid var(--pg-border);background:var(--pg-light);border-radius:20px;padding:7px 14px;font-size:12px;cursor:pointer;color:var(--pg-text);}
#pg-exportbox button:hover{border-color:var(--pg-primary);color:var(--pg-primary-dark);}

/* Panel leyenda */
#pg-legend{
  background:#fff;border-bottom:1px solid var(--pg-border);
  padding:0 16px; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .25s ease;
  display:flex; gap:32px; flex-wrap:wrap;
}
#pg-legend.open{max-height:240px; padding:14px 16px;}
.pg-legend-group h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7A8890;}
.pg-legend-group{min-width:190px;}
.pg-legend-item{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;cursor:pointer;user-select:none;}
.pg-legend-item input{accent-color:var(--pg-primary);cursor:pointer;}
.pg-swatch{width:12px;height:12px;border-radius:50%;flex:0 0 auto;display:inline-block;}
.pg-legend-actions{display:flex;align-items:flex-end;gap:8px;}
.pg-legend-actions button{border:1px solid var(--pg-border);background:var(--pg-light);border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--pg-text);}
.pg-legend-actions button:hover{border-color:var(--pg-primary);color:var(--pg-primary-dark);}

#map{flex:1;min-height:300px;}

/* Popup */
.leaflet-popup-content-wrapper{border-radius:8px;}
.pg-popup h3{margin:0 0 4px;font-size:15px;color:var(--pg-dark);}
.pg-place{font-size:11px;color:var(--pg-accent);font-weight:600;margin:-2px 0 6px;}
.pg-popup p{margin:0 0 8px;font-size:13px;line-height:1.4;color:#445;}
.pg-popup .pg-links a{display:inline-block;margin:2px 6px 4px 0;padding:4px 10px;border-radius:14px;font-size:12px;text-decoration:none;color:#fff;font-weight:600;}
.pg-popup a.blog{background:var(--pg-primary);}
.pg-popup a.blog:hover{background:var(--pg-primary-dark);}
.pg-popup a.app{background:var(--pg-accent);}
.pg-popup a.video{background:#CC1F2C;}
.pg-tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:0 6px 4px 0;padding:2px 7px;border-radius:10px;color:#fff;}
.pg-tag.tech{background:var(--pg-dark);}
.pg-videos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pg-video-thumb{position:relative;display:block;width:100px;height:56px;border-radius:6px;overflow:hidden;cursor:pointer;background:#000;flex:0 0 auto;text-decoration:none;}
.pg-video-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;}
.pg-video-thumb .pg-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.pg-blog-badge{display:block;width:100%;height:90px;object-fit:cover;border-radius:6px;margin:2px 0 6px;}
.pg-blog-badge-logo{height:22px;width:auto;object-fit:contain;opacity:.9;background:none;}
.leaflet-popup-content{width:auto !important;max-width:260px;}

.marker-cluster-pg{background:rgba(232,100,87,.35);}
.marker-cluster-pg div{background:var(--pg-primary);color:#fff;font-weight:700;}
.marker-cluster-poi{background:rgba(122,136,144,.35);}
.marker-cluster-poi div{background:#7A8890;color:#fff;font-weight:700;font-size:11px;width:26px!important;height:26px!important;line-height:26px!important;margin:3px!important;}

/* Listado inferior — SEO / accesibilidad / IA */
#pg-list-section{background:#fff;border-top:1px solid var(--pg-border);max-height:0;overflow:hidden;transition:max-height .25s ease;}
#pg-list-section.open{max-height:38vh;overflow-y:auto;}
#pg-list-toggle{width:100%;text-align:left;background:var(--pg-light);border:none;border-top:1px solid var(--pg-border);padding:8px 16px;font-size:12px;color:var(--pg-dark);cursor:pointer;font-weight:600;}
#pg-list-toggle:hover{color:var(--pg-primary);}
#pg-list{columns:2;column-gap:24px;padding:12px 20px 20px;margin:0;list-style:none;}
#pg-list li{break-inside:avoid;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--pg-border);}
#pg-list li a{color:var(--pg-dark);text-decoration:none;font-weight:600;}
#pg-list li a:hover{color:var(--pg-primary);}
#pg-list li span{display:block;color:#7A8890;font-size:11px;}

@media (max-width:640px){
  header.pg-header{flex-direction:column;align-items:stretch;}
  .pg-search-wrap{max-width:none;}
  #pg-list{columns:1;}
  #pg-legend{gap:16px;}
}
</style>
</head>
<body>
<div id="app">

  <header class="pg-header">
    <h1>Mapa de proyectos <span>Play&amp;go</span> experience</h1>
    <div class="pg-search-wrap">
      <input id="pg-search" type="search" placeholder="Buscar proyecto, lugar o app..." aria-label="Buscar proyecto">
    </div>
    <button id="pg-legend-toggle" aria-expanded="true" aria-controls="pg-legend">🎚 Leyenda</button>
    <button id="pg-add-toggle" aria-expanded="false" aria-controls="pg-addform">➕ Añadir proyecto</button>
    <button id="pg-export-toggle" aria-expanded="false" aria-controls="pg-exportbox">⭳ Exportar CSV</button>
    <div class="pg-badges" id="pg-badges">
      <span class="pg-badge pg-badge-projects">📌 <span id="pg-count-projects" class="pg-badge-num"></span></span>
      <span class="pg-badge pg-badge-pois">•• <span id="pg-count-pois" class="pg-badge-num"></span></span>
    </div>
    <img class="pg-visits-badge" id="pg-visits" alt="Visitas" loading="lazy"
      src="https://hits.sh/mapa.playgoxp.com.svg?style=flat-square&label=visitas&color=e86457&labelColor=201a18">
  </header>

  <!-- Formulario para añadir un proyecto/POI nuevo. Solo vive en el navegador
       hasta que se exporta a CSV; no se guarda en ningún servidor. -->
  <form id="pg-addform" aria-label="Añadir nuevo proyecto al mapa">
    <div class="pg-form-row">
      <label>Nombre*<input type="text" id="pgf-name" required placeholder="Nombre del proyecto"></label>
      <label>Lugar (opcional)<input type="text" id="pgf-place" placeholder="Ciudad / lugar concreto"></label>
    </div>
    <div class="pg-form-row">
      <label>Sector*
        <select id="pgf-sector" required></select>
      </label>
      <label>Tecnología*
        <select id="pgf-tech" required></select>
      </label>
      <label>Tipo*
        <select id="pgf-kind" required>
          <option value="proyecto">Proyecto</option>
          <option value="poi">Punto de interés</option>
        </select>
      </label>
    </div>
    <label>Descripción (opcional)<textarea id="pgf-desc" rows="2" placeholder="Breve descripción"></textarea></label>
    <div class="pg-form-row">
      <label>Latitud*<input type="text" id="pgf-lat" required placeholder="ej. 39.4699"></label>
      <label>Longitud*<input type="text" id="pgf-lon" required placeholder="ej. -0.3763"></label>
      <button type="button" id="pgf-pick" class="pg-form-pick">📍 Clic en el mapa</button>
    </div>
    <div class="pg-form-row">
      <label>Enlace (opcional)<input type="url" id="pgf-link-url" placeholder="https://..."></label>
      <label>Tipo de enlace
        <select id="pgf-link-kind">
          <option value="blog">Blog</option>
          <option value="app">App</option>
          <option value="video">Vídeo</option>
        </select>
      </label>
    </div>
    <div class="pg-form-actions">
      <button type="submit" class="pg-form-submit">Añadir al mapa</button>
      <span id="pgf-status" class="pg-form-status"></span>
    </div>
  </form>

  <!-- Exportar a CSV: "Visible ahora" respeta los filtros activos (leyenda + buscador);
       "Añadidos en esta sesión" son solo los creados con el formulario de arriba. -->
  <div id="pg-exportbox">
    <button type="button" id="pg-export-visible">Exportar lo visible según filtros (<span id="pg-export-visible-n">0</span>)</button>
    <button type="button" id="pg-export-draft">Exportar mis proyectos añadidos (<span id="pg-export-draft-n">0</span>)</button>
    <button type="button" id="pg-clear-draft">🗑 Vaciar mis añadidos</button>
  </div>

  <nav id="pg-legend" class="open" aria-label="Filtros por sector, tecnología y tipo">
    <div class="pg-legend-group" id="pg-legend-type">
      <h4>Tipo</h4>
    </div>
    <div class="pg-legend-group" id="pg-legend-sector">
      <h4>Sector</h4>
    </div>
    <div class="pg-legend-group" id="pg-legend-tech">
      <h4>Tecnología</h4>
    </div>
    <div class="pg-legend-actions">
      <button id="pg-legend-all">Marcar todo</button>
      <button id="pg-legend-none">Desmarcar todo</button>
    </div>
  </nav>

  <main id="map" role="application" aria-label="Mapa interactivo de proyectos Play&go experience"></main>

  <button id="pg-list-toggle" aria-expanded="false" aria-controls="pg-list-section">▾ Ver listado completo de proyectos (texto, para lectores de pantalla y buscadores)</button>
  <section id="pg-list-section">
    <ul id="pg-list"></ul>
  </section>

</div>

<script type="application/ld+json" id="pg-jsonld"></script>

function sectorColor(sec){

const markers = [];
function youtubeId(url){
  const m = url.match(/(?:youtu\.be\/|shorts\/|v=)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

  const otherLinks = (item.links||[]).filter(l=>l.kind!=='video');
  const videoLinks = (item.links||[]).filter(l=>l.kind==='video').map(l=>({...l, yid: youtubeId(l.url)})).filter(l=>l.yid);
  const blogLink = otherLinks.find(l=>l.kind==='blog');
  const linksHtml = otherLinks.map(l=>
    `<a class="${l.kind}" href="${l.url}" target="_blank" rel="noopener">${LINK_LABEL[l.kind]||'Ver más'} ↗</a>`
  ).join('');
  const videosHtml = videoLinks.map(l=>

       <img src="https://i.ytimg.com/vi/${l.yid}/mqdefault.jpg" loading="lazy" referrerpolicy="no-referrer" alt=""
         onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${l.yid}/hqdefault.jpg'">

     </a>`
  ).join('');
  m.bindPopup(
    `<div class="pg-popup">
       <span class="pg-tag" style="background:${sectorColor(item.sector)}">${SECTOR_LABEL[item.sector]||''}</span>
       <span class="pg-tag tech">${TECH_LABEL[item.tech]||''}</span>

       <h3>${escapeHtml(item.name)}</h3>

       <div class="pg-links">${linksHtml}</div>
     </div>`
  );
  (isPoi ? poiCluster : projectCluster).addLayer(m);
  markers.push({marker:m, item, cluster: isPoi ? poiCluster : projectCluster});
});

const searchInput = document.getElementById('pg-search');
const countProjectsEl = document.getElementById('pg-count-projects');
const countPoisEl = document.getElementById('pg-count-pois');

let lastVisibleItems = [];
function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  projectCluster.clearLayers();
  poiCluster.clearLayers();
  let visibleProjects = 0, visiblePois = 0, firstMatch = null, matchedLayers = [];
  lastVisibleItems = [];
  markers.forEach(({marker, item, cluster})=>{
    const matchesText = !q || item.name.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q) || (item.place||'').toLowerCase().includes(q);
    const matchesSector = secState[item.sector];
    const matchesTech = techState[item.tech];
    const matchesType = typeState[item.kind];
    if(matchesText && matchesSector && matchesTech && matchesType){
      cluster.addLayer(marker);
      matchedLayers.push(marker);
      lastVisibleItems.push(item);
      if(item.kind==='poi') visiblePois++; else visibleProjects++;
      if(!firstMatch) firstMatch = marker;
    }
  });
  document.getElementById('pg-export-visible-n').textContent = lastVisibleItems.length;
  const totalProjects = markers.filter(x=>x.item.kind!=='poi').length;
  const totalPois = markers.filter(x=>x.item.kind==='poi').length;
  countProjectsEl.textContent = `${visibleProjects}/${totalProjects} proyectos`;
  countPoisEl.textContent = `${visiblePois}/${totalPois} POIs`;
  const visible = visibleProjects + visiblePois;
  if(q && visible === 1 && firstMatch){
    map.setView(firstMatch.getLatLng(), 13);
    firstMatch.openPopup();
  } else if(visible>0 && visible<markers.length){
    const group = L.featureGroup(matchedLayers);
    map.fitBounds(group.getBounds().pad(0.3));
  } else if(visible===markers.length){
    map.setView([40.2,-1.5], 6);
  }
}
searchInput.addEventListener('input', applyFilter);
applyFilter();

const draftLayer = L.layerGroup().addTo(map);

const PG_DRAFT_KEY = 'playgo_mapa_borrador_v1';

function saveDraftsToStorage(){
  try { localStorage.setItem(PG_DRAFT_KEY, JSON.stringify(pgDraftPoints)); } catch(e){ /* almacenamiento no disponible, se ignora */ }
}
function renderDraftMarker(item){
  const m = L.marker([item.lat, item.lon], {icon: draftIcon(sectorColor(item.sector)), title: item.name});
  m.bindPopup(
    `<div class="pg-popup">
       <span class="pg-tag" style="background:${sectorColor(item.sector)}">${SECTOR_LABEL[item.sector]||''}</span>
       <span class="pg-tag" style="background:#FFD34D;color:#201a18">SIN PUBLICAR</span>
       <h3>${escapeHtml(item.name)}</h3>
       ${item.place ? `<div class="pg-place">📍 ${escapeHtml(item.place)}</div>` : ''}
       ${item.desc ? `<p>${escapeHtml(item.desc)}</p>` : ''}
     </div>`
  );
  draftLayer.addLayer(m);
}
// Recuperar lo guardado en este navegador de una sesión anterior, si lo hay
try {
  const saved = JSON.parse(localStorage.getItem(PG_DRAFT_KEY) || '[]');
  saved.forEach(item=>{ pgDraftPoints.push(item); renderDraftMarker(item); });
  if(saved.length){ document.getElementById('pg-export-draft-n').textContent = saved.length; }

document.getElementById('pg-addform').addEventListener('submit', (e)=>{
  e.preventDefault();
  const lat = parseFloat(document.getElementById('pgf-lat').value);
  const lon = parseFloat(document.getElementById('pgf-lon').value);
  const statusEl = document.getElementById('pgf-status');
  if(isNaN(lat) || isNaN(lon)){
    statusEl.textContent = 'Latitud/longitud no válidas.';
    statusEl.style.color = '#C2185B';
    return;
  }
  const item = {
    name: document.getElementById('pgf-name').value.trim(),
    place: document.getElementById('pgf-place').value.trim(),
    desc: document.getElementById('pgf-desc').value.trim(),
    sector: sectorSelect.value,
    tech: techSelect.value,
    kind: document.getElementById('pgf-kind').value,
    lat, lon,
    links: []
  };
  const linkUrl = document.getElementById('pgf-link-url').value.trim();
  if(linkUrl){ item.links.push({url: linkUrl, kind: document.getElementById('pgf-link-kind').value}); }

  renderDraftMarker(item);
  pgDraftPoints.push(item);
  saveDraftsToStorage();
  document.getElementById('pg-export-draft-n').textContent = pgDraftPoints.length;

  statusEl.textContent = `✓ "${item.name}" añadido y guardado en este navegador (${pgDraftPoints.length} en total)`;
  statusEl.style.color = 'var(--pg-accent)';
  e.target.reset();
});

function csvEscape(v){
  v = (v==null?'':String(v));

function itemsToCsv(items){
  const header = ['nombre','lugar','descripcion','sector','tecnologia','tipo','lat','lon','enlaces'];
  const rows = items.map(it=>{
    const enlaces = (it.links||[]).map(l=>`${l.kind}:${l.url}`).join(' | ');
    return [it.name, it.place||'', it.desc||'', it.sector, it.tech, it.kind, it.lat, it.lon, enlaces]
      .map(csvEscape).join(',');
  });
  return header.join(',') + '\n' + rows.join('\n');
}
function downloadCsv(filename, csvText){
  const blob = new Blob(['\uFEFF' + csvText], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('pg-export-visible').addEventListener('click', ()=>{
  downloadCsv('mapa-playgo-visible.csv', itemsToCsv(lastVisibleItems));
});
document.getElementById('pg-export-draft').addEventListener('click', ()=>{
  if(pgDraftPoints.length===0){ alert('Todavía no has añadido ningún proyecto nuevo.'); return; }
  downloadCsv('mapa-playgo-nuevos.csv', itemsToCsv(pgDraftPoints));
});
document.getElementById('pg-clear-draft').addEventListener('click', ()=>{
  if(pgDraftPoints.length===0){ return; }
  if(!confirm(`¿Vaciar los ${pgDraftPoints.length} proyectos que has añadido en este navegador? (Asegúrate de haberlos exportado antes si los quieres conservar)`)) return;
  pgDraftPoints.length = 0;
  draftLayer.clearLayers();
  localStorage.removeItem(PG_DRAFT_KEY);
  document.getElementById('pg-export-draft-n').textContent = '0';
});
</script>
